[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-network-management"
version = "0.1.0"
description = "Open-source policy-gated agentic infrastructure and security operations platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "nats-py>=2.9,<3.0",
  "httpx>=0.27,<1.0",
  "structlog>=24.4,<26.0",
  "jsonschema>=4.23,<5.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.7,<1.0",
  "mypy>=1.13,<2.0",
  "aiosqlite>=0.20,<1.0"
]

[tool.setuptools.packages.find]
where = ["services/control_api"]
include = ["anm*"]

[tool.setuptools.package-data]
"anm.capability_manifests" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/control_api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["anm"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
