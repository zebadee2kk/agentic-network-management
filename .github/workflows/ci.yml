name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python control plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check services/control_api tests tools
      - name: Unit tests
        run: pytest -q
      - name: Migration smoke test
        env:
          ANM_DATABASE_URL: sqlite+pysqlite:///./migration-smoke.db
        run: alembic upgrade head

  phase6-safety:
    name: Phase 6 execution safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Execution safety tests
        run: pytest -q tests/test_phase6_execution.py

  policy:
    name: OPA policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Rego policy
        run: >-
          docker run --rm
          -v "$PWD/policies/opa:/policies:ro"
          openpolicyagent/opa:1.12.2-static
          test /policies -v

  ui:
    name: TypeScript UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/ui/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Validate trust boundaries
        run: |
          docker compose config --format json > /tmp/anm-compose.json
          python3 tools/validate_compose_boundaries.py /tmp/anm-compose.json

  appliance:
    name: Appliance smoke test
    needs: [python, phase6-safety, policy, ui, compose]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start appliance
        run: docker compose up -d --build
      - name: Require worker and relay health
        run: |
          for worker in discovery-worker telemetry-worker ai-worker model-relay executor-worker verifier-worker; do
            worker_id=$(docker compose ps -q "$worker")
            test -n "$worker_id"
            healthy=false
            for attempt in $(seq 1 45); do
              worker_state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$worker_id")
              if [ "$worker_state" = "healthy" ]; then
                healthy=true
                break
              fi
              if [ "$worker_state" = "unhealthy" ] || [ "$worker_state" = "exited" ]; then
                docker compose ps
                docker compose logs --no-color "$worker"
                exit 1
              fi
              sleep 2
            done
            if [ "$healthy" != "true" ]; then
              docker compose ps
              docker compose logs --no-color "$worker"
              exit 1
            fi
          done
      - name: Require end-to-end readiness and safe execution default
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8080/health/ready \
              --output /tmp/anm-readiness.json; then
              cat /tmp/anm-readiness.json
              curl --fail --silent --show-error \
                http://127.0.0.1:8080/api/v1/ai/status \
                --output /tmp/anm-ai-status.json
              cat /tmp/anm-ai-status.json
              grep -q '"enabled":false' /tmp/anm-ai-status.json
              curl --fail --silent --show-error \
                http://127.0.0.1:8080/api/v1/execution-control \
                --output /tmp/anm-execution-control.json
              cat /tmp/anm-execution-control.json
              grep -q '"enabled":false' /tmp/anm-execution-control.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Tear down appliance
        if: always()
        run: docker compose down -v --remove-orphans
