name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python control plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check services/control_api tests tools
      - name: Unit tests
        run: pytest -q
      - name: Migration smoke test
        env:
          ANM_DATABASE_URL: sqlite+pysqlite:///./migration-smoke.db
        run: alembic upgrade head

  policy:
    name: OPA policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Rego policy
        run: >-
          docker run --rm
          -v "$PWD/policies/opa:/policies:ro"
          openpolicyagent/opa:1.12.2-static
          test /policies -v

  ui:
    name: TypeScript UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/ui/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Validate trust boundaries
        run: |
          docker compose config --format json > /tmp/anm-compose.json
          python3 tools/validate_compose_boundaries.py /tmp/anm-compose.json

  appliance:
    name: Appliance smoke test
    needs: [python, policy, ui, compose]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start appliance
        run: docker compose up -d --build
      - name: Require discovery worker health
        run: |
          worker_id=$(docker compose ps -q discovery-worker)
          test -n "$worker_id"
          for attempt in $(seq 1 30); do
            worker_state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$worker_id")
            if [ "$worker_state" = "healthy" ]; then
              exit 0
            fi
            if [ "$worker_state" = "unhealthy" ] || [ "$worker_state" = "exited" ]; then
              docker compose ps
              docker compose logs --no-color discovery-worker
              exit 1
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color discovery-worker
          exit 1
      - name: Require end-to-end readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8080/health/ready \
              --output /tmp/anm-readiness.json; then
              cat /tmp/anm-readiness.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Tear down appliance
        if: always()
        run: docker compose down -v --remove-orphans
