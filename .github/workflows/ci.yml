name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python control plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check services/control_api tests
      - name: Unit tests
        run: pytest -q
      - name: Migration smoke test
        env:
          ANM_DATABASE_URL: sqlite+pysqlite:///./migration-smoke.db
        run: alembic upgrade head

  policy:
    name: OPA policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Rego policy
        run: >-
          docker run --rm
          -v "$PWD/policies/opa:/policies:ro"
          openpolicyagent/opa:1.12.2-static
          test /policies -v

  ui:
    name: TypeScript UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/ui/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
